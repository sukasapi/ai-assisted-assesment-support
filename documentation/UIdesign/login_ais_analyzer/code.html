<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body {
            background-color: #f8fafc; /* Zinc-50 equivalent for base layer as per guidance */
        }

<body class="min-h-screen flex items-center justify-center p-gutter">
<div class="w-full max-w-md">
<!-- Brand Identity -->
<div class="text-center mb-stack_md">
<div class="inline-flex items-center justify-center w-12 h-12 mb-stack_sm bg-primary text-on-primary rounded">
<span class="material-symbols-outlined text-display" data-icon="analytics">analytics</span>
</div>
<h1 class="font-display text-display text-primary tracking-tight">AIS-ANALYZER</h1>
<p class="font-body-muted text-body-muted text-on-surface-variant mt-2">Masuk ke platform analisis asesmen Anda</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded shadow-sm p-8">
<form action="#" class="space-y-stack_md" method="POST">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-section-header text-section-header text-on-surface" for="email">Alamat Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="mail">mail</span>
</div>
<input autofocus="" class="block w-full pl-10 pr-3 py-2.5 bg-surface-container-lowest border border-outline-variant text-on-surface font-body-base rounded focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-on-surface-variant/50" id="email" name="email" placeholder="nama@perusahaan.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="font-section-header text-section-header text-on-surface" for="password">Kata Sandi</label>
<a class="font-label text-label text-secondary hover:underline transition-colors" href="#">Lupa sandi?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 bg-surface-container-lowest border border-outline-variant text-on-surface font-body-base rounded focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me & Terms -->
<div class="flex items-center justify-between py-1">
<div class="flex items-center">
<input class="h-4 w-4 text-primary border-outline-variant rounded focus:ring-primary" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-muted text-body-muted text-on-surface-variant" for="remember-me">
                            Ingat saya
                        </label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent font-section-header text-section-header text-on-primary bg-primary hover:bg-on-primary-container active:scale-[0.98] transition-all rounded" type="submit">
<span>Masuk</span>
<span class="material-symbols-outlined text-[18px]" data-icon="login">login</span>
</button>
</form>
<!-- Decorative Visual Token (subtle AI violet hint) -->
<div class="mt-8 pt-6 border-t border-outline-variant/30 flex items-center justify-center gap-4">
<div class="flex -space-x-2">
<img alt="Analyst 1" class="inline-block h-8 w-8 rounded-full ring-2 ring-surface-container-lowest" data-alt="A professional close-up portrait of a woman working in a high-tech corporate environment. She is smiling confidently, set against a background of soft-focus office windows with a light-mode color palette. The lighting is bright and clean, emphasizing a professional and systematic atmosphere. The image is crisp, modern, and aligned with a neutral zinc aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA6OaWGO3OCQRUCG2gAMjVFX4ZHjixZuk4tlt29kS5d6wIuMx9Qq-L0t1TPYIg1LouYlC2MD5om-xhI3GZydBtWa8xlFb2kSkNnu2tdOlIi_woxgXhqaDu5a4RqJx9dv2EZhjhzt7f5kze0f1a5hRcunJE0nzG6jwtLEqsTlzrIJplINWDozBIWRl6xDXBlNYzvZhr-8pRbWIHLf2kptoK0fk1OtyNQIDKOCm--k7CAGQtc9qE4ABA1STK2Ay5AnExAHW5VRbcjmdI"/>
<img alt="Analyst 2" class="inline-block h-8 w-8 rounded-full ring-2 ring-surface-container-lowest" data-alt="A sharp, professional headshot of a man in a modern workspace, wearing a neutral-toned business casual outfit. The lighting is high-key and natural, creating a soft, bright aura characteristic of professional photography. The background shows a minimalist office interior with cool gray tones. The overall mood is one of intelligence, focus, and corporate reliability." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD9Y0TUfakvdk9XceyYqz0cEPiYMmac7ADx6cyNj1ZKzmA6ATPx8_iMEjlVbJL6BgCDCWD6CSbuM9R9NjWwK4E5KlpVABEmHDMQBgQI9EogQhwA0IqGjyZJjbgHjZ5Y3A1xkF_gj9iYPOK-e6MJnxZZksoUv57QAlx3K5yyTSbipiz0p2-X9xSATexloxq0Mq_QcrjhKcRxGnO0IhARBdAqK4HsMrFYEhOmavSAXRedxLXd4u-Tmy4chBgbNMcfbqzptJ3OS3Lrk_s"/>
</div>
<p class="font-label text-label text-on-surface-variant">Bergabung dengan 200+ analis data lainnya</p>
</div>
</div>
<!-- Footer Footer -->
<p class="mt-stack_md text-center font-body-muted text-body-muted text-on-surface-variant">
            Belum punya akun? 
            <a class="font-section-header text-section-header text-secondary hover:underline" href="#">Hubungi Admin</a>
</p>
<!-- Technical Metadata -->
<div class="mt-12 flex justify-center gap-6 opacity-30 grayscale hover:opacity-100 transition-opacity">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="verified_user">verified_user</span>
<span class="font-code text-code">SSO ENABLED</span>
</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="cloud_done">cloud_done</span>
<span class="font-code text-code">V2.4.0-STABLE</span>
</div>
</div>
</div>
