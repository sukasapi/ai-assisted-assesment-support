<body class="min-h-screen flex items-center justify-center p-gutter bg-surface">
<!-- Main Container following max-w-6xl PRD recommendation for alignment context, though focused as a centered login -->
<div class="w-full max-w-6xl mx-auto flex flex-col items-center justify-center animate-in fade-in duration-700">
<div class="w-full max-w-md">
<!-- Brand Identity: Aligned Logo and Text -->
<div class="text-center mb-stack-lg">
<div class="inline-flex items-center justify-center w-14 h-14 mb-stack-md bg-primary text-on-primary rounded-xl shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-[32px]" data-icon="analytics">analytics</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">AIS-ANALYZER</h1>
<p class="text-body-md text-on-surface-variant mt-2">Masuk ke platform analisis asesmen Anda</p>
</div>
<!-- Login Card: Refined Balance and Spacing -->
<div class="bg-surface-container-lowest border border-outline-variant/60 rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-8 md:p-10 transition-all hover:shadow-[0_8px_40px_rgb(0,0,0,0.08)]">
<form action="#" class="space-y-stack-md" method="POST">
<!-- Email Field: Consistent Spacing -->
<div class="space-y-stack-sm">
<label class="font-headline-md text-label-md text-on-surface" for="email">Alamat Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="mail">mail</span>
</div>
<input autofocus="" class="block w-full pl-10 pr-3 py-3 bg-surface-container-low border border-outline-variant/60 text-on-surface font-body-md rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all placeholder:text-on-surface-variant/40" id="email" name="email" placeholder="nama@perusahaan.com" required="" type="email"/>
</div>
</div>
<!-- Password Field: Consistent Spacing -->
<div class="space-y-stack-sm">
<div class="flex items-center justify-between">
<label class="font-headline-md text-label-md text-on-surface" for="password">Kata Sandi</label>
<a class="font-headline-md text-label-sm text-primary hover:text-primary/80 transition-colors" href="#">Lupa sandi?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-surface-container-low border border-outline-variant/60 text-on-surface font-body-md rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all placeholder:text-on-surface-variant/40" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center justify-between py-1">
<div class="flex items-center">
<input class="h-4 w-4 text-primary border-outline-variant rounded focus:ring-primary transition-all" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-label-md text-on-surface-variant select-none" for="remember-me">
                                Ingat saya
                            </label>
</div>
</div>
<!-- Submit Button: Kinetic Professional Styling -->
<button class="w-full flex justify-center items-center gap-2 py-3.5 px-4 font-headline-md font-semibold text-on-primary bg-primary hover:bg-primary/90 active:scale-[0.98] shadow-md shadow-primary/20 transition-all rounded-lg" type="submit">
<span>Masuk Sekarang</span>
<span class="material-symbols-outlined text-[18px]" data-icon="login">login</span>
</button>
</form>
<!-- Social Proof: Cleaner Alignment -->
<div class="mt-10 pt-6 border-t border-outline-variant/30 flex flex-col sm:flex-row items-center justify-center gap-4 text-center sm:text-left">
<div class="flex -space-x-2">

</div>
<p class="text-label-sm text-on-surface-variant font-headline-md uppercase tracking-wider">Bergabung dengan 200+ analis data lainnya</p>
</div>
</div>

<p class="mt-stack-lg text-center text-body-md text-on-surface-variant">
                Belum punya akun? 
                <a class="font-headline-md font-semibold text-primary hover:underline underline-offset-4" href="#">Hubungi Admin</a>
</p>

<div class="mt-12 flex justify-center gap-8 opacity-40 hover:opacity-100 transition-opacity">
<div class="flex items-center gap-1.5 group">

</div>
